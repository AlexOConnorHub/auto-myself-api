info:
  name: Get maintenances given vehicle ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/vehicle/:vehicle_id/maintenance"
  params:
    - name: vehicle_id
      value: "{{vehicle_1}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
