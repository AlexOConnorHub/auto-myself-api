services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_user_password}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      PGPORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql
  postgres_test:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-app_user_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-app_user_test_password}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-appdb_test}
      PGPORT: ${POSTGRES_TEST_PORT:-5433}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:${POSTGRES_TEST_PORT:-5433}"
volumes:
  pgdata:
